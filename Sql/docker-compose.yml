services:
  mysql:
    image: mysql:latest
    container_name: mysql-learning
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mohit@SQL}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
      - ./learningsql.sql:/workspace/learningsql.sql

volumes:
  mysql_data:
